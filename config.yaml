# Maritime Watch configuration. Safe to edit; no secrets here (see .env).

site:
  # used to build "open on the map" links in Telegram messages
  url: "https://keremkalyoncu.github.io/maritime-watch"
  repo: "https://github.com/KeremKalyoncu/maritime-watch"

region:
  name: "Türkiye karasuları ve civarı"
  bbox: { lat_min: 35.0, lat_max: 43.5, lon_min: 25.0, lon_max: 42.5 }

ais:
  enabled: true
  ws_url: "wss://stream.aisstream.io/v0/stream"
  capture_seconds: 90
  vessel_history: 20
  vessel_ttl_hours: 12       # forget vessels not heard from for this long (keeps data/vessels.json small enough to commit)
  # MMSI prefixes for AIS distress transmitters (ITU): SART 970, MOB 972, EPIRB-AIS 974
  distress_mmsi_prefixes: ["970", "972", "974"]

anomaly:
  moving_speed_kn: 3.0
  stopped_speed_kn: 0.5
  stop_minutes: 20
  # A vessel absent from one 90 s burst is not missing. Flag only after this many
  # consecutive cycles without a report, inside the time window, and only when
  # port arrival / leaving the box cannot explain it.
  gap_minutes: 45
  gap_max_minutes: 1440
  gap_min_cycles: 3
  # Ordinary course changes are not incidents; off by default. When on, only a
  # near-reversal by a cargo/tanker counts.
  course_spike_enabled: false
  course_reversal_deg: 120

# extra sources, each independently toggleable
sources:
  # Cached files in src/ingest/samples/ are TEST FIXTURES. With this off (the
  # production default) a dead source publishes nothing instead of publishing the
  # fixture. Turning it on once put the fixture's "dalga 2.7 m / 41 kn" on the live
  # channel as a real forecast. Only enable it for offline demos.
  use_samples_when_down: false
  scrape: true          # Sahil Güvenlik announcements (see scrape: below)
  openmeteo: true        # marine + wind forecast (no key) - replaces MGM
  quakes: true           # AFAD + USGS + EMSC earthquakes (cross-confirmed)
  navwarn: false         # NGA NAVAREA III - public endpoint currently 404s; enable when fixed
  news: true             # Turkish + maritime news RSS, keyword filtered
  gdacs: true            # global disaster alerts (RSS), filtered to the region
  eonet: true            # NASA EONET natural events
  reliefweb: false       # ReliefWeb API v1 retired (410); code kept for when v2 access is wired
  metar: true            # coastal airport weather

scrape:
  mgm: false             # MGM has no stable public endpoint; Open-Meteo covers this
  sahil_guvenlik: true
  afad: false            # announcements page 404s; AFAD data comes via quakes: below
  keywords:
    - "kaza"
    - "batık"
    - "batan"
    - "battı"
    - "alabora"
    - "kurtar"
    - "arama kurtarma"
    - "mahsur"
    - "yaralı"
    - "kayıp"
    - "denize düş"
    - "can kaybı"
    - "cansız"
    - "imdat"
    - "tekne"
    - "sürüklen"

openmeteo:
  wave_m: 2.0            # significant wave height that triggers a warning
  wind_gust_kn: 33.0     # ~7 Bft
  hours_ahead: 36
  points:
    - { name: "Marmara Denizi", lat: 40.75, lon: 28.30 }
    - { name: "İzmit Körfezi", lat: 40.72, lon: 29.55 }
    - { name: "İstanbul Boğazı", lat: 41.15, lon: 29.10 }
    - { name: "Çanakkale Boğazı", lat: 40.15, lon: 26.40 }
    - { name: "Saroz Körfezi", lat: 40.50, lon: 26.40 }
    - { name: "Kuzey Ege", lat: 39.20, lon: 26.30 }
    - { name: "Güney Ege", lat: 37.00, lon: 27.10 }
    - { name: "Antalya Körfezi", lat: 36.55, lon: 30.60 }
    - { name: "Mersin Körfezi", lat: 36.55, lon: 34.40 }
    - { name: "İskenderun Körfezi", lat: 36.60, lon: 35.90 }
    - { name: "Batı Karadeniz", lat: 41.70, lon: 31.80 }
    - { name: "Orta Karadeniz", lat: 42.10, lon: 35.10 }
    - { name: "Doğu Karadeniz", lat: 41.30, lon: 39.70 }

quakes:
  min_mag: 3.8           # coastal quakes at/above this magnitude
  hours_back: 24

navwarn:
  # keep warnings whose text mentions any of these (NAVAREA III is huge)
  keep_terms: ["turkey", "turkish", "marmara", "aegean", "black sea", "bosphorus",
               "bosporus", "dardanelles", "istanbul", "canakkale", "izmir", "mersin",
               "iskenderun", "antalya", "samsun", "trabzon"]

news:
  max_items_per_feed: 40
  hours_back: 36
  feeds:
    - "https://www.aa.com.tr/tr/rss/default?cat=guncel"
    - "https://www.hurriyet.com.tr/rss/gundem"
    - "https://www.ntv.com.tr/turkiye.rss"
    - "https://www.sozcu.com.tr/feed/"
    - "https://www.cnnturk.com/feed/rss/turkiye/news"
    - "https://www.trthaber.com/sondakika.rss"
    - "https://www.haberturk.com/rss"
    - "https://www.milliyet.com.tr/rss/rssnew/gundemrss.xml"
    - "https://www.denizhaber.com.tr/rss/"
    - "https://gcaptain.com/feed/"
  # a headline must contain one maritime word AND one incident word
  maritime_words: ["deniz", "tekne", "gemi", "balıkçı", "sahil", "liman", "kıyı",
                   "boğaz", "feribot", "yat", "sandal", "denizci", "açıklar",
                   "tanker", "körfez", "şilep", "römorkör", "yelkenli", "kotra",
                   "gemisi", "teknesi", "vapur", "iskele"]
  incident_words: ["battı", "batan", "alabora", "kurtar", "kayıp", "mahsur",
                   "yaralı", "kaza", "arama kurtarma", "sürüklen", "can kaybı",
                   "göçmen", "fırtına", "boğul", "hayatını kaybet", "karaya otur",
                   "su alıyor", "su aldı", "tahliye", "mahsur", "yan yattı"]

gdacs:
  alert_levels: ["Orange", "Red"]
  event_types: ["TC", "FL", "EQ", "WF"]   # cyclone, flood, quake, wildfire

metar:
  # coastal / near-coast airports
  stations: ["LTBA", "LTFM", "LTFJ", "LTBU", "LTBS", "LTFE", "LTAI", "LTCG",
             "LTFH", "LTCM", "LTCS", "LTAF"]
  wind_gust_kn: 33.0
  visibility_m: 2000

alert:
  telegram:
    enabled: true
    only_status: ["confirmed", "probable"]   # incident statuses that get pushed
    prevention: true                          # push weather / quake / navwarn / gdacs
    send_location_pin: true                   # also send a Telegram map pin
    digest: true                              # one combined message per cycle (SART still instant)
  min_severity: "major"
  stale_hours: 2                              # map shows a "data is old" banner past this

loop:
  interval_seconds: 900
