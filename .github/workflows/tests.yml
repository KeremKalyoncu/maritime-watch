name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pipx run ruff check .

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python eval/run_eval.py

  # The Note 4 edge host runs the engine loop on Termux Python 3.8; keep it working.
  edge-py38:
    runs-on: ubuntu-latest
    container: python:3.8-slim
    steps:
      - uses: actions/checkout@v7
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q

  # Single required status check for branch protection (matrix jobs stay informative)
  ci:
    name: ci
    needs: [lint, pytest, edge-py38]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All checks green
        run: |
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.pytest.result }}" = "success"
          test "${{ needs.edge-py38.result }}" = "success"
