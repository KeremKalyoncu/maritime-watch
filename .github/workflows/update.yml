name: update-and-publish

# Modern zero-commit GitHub Pages deployment:
# 1. Run the cycle on schedule or via immediate repository_dispatch webhook.
# 2. Persist engine track state (data/vessels.json, events.jsonl) via GitHub Actions Cache.
# 3. Publish web/ directly to GitHub Pages CDN via Artifact Deployment.
# 4. Zero commits on main, zero repo bloat, zero push race conflicts.

on:
  schedule:
    # Staggered non-peak minutes (7, 22, 37, 52) to avoid GitHub's top-of-hour runner congestion
    - cron: "7,22,37,52 * * * *"
  # Allows zero-delay triggers via external free pingers (Cron-Job.org, Cloudflare Workers, Note 4, etc.)
  repository_dispatch:
    types: [maritime_tick, ping, emergency]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: maritime-watch-update
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore engine state cache
        uses: actions/cache/restore@v4
        with:
          path: data
          key: maritime-state-${{ github.run_id }}
          restore-keys: |
            maritime-state-

      - run: pip install -r requirements.txt

      - name: Run one cycle
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: python run.py --once

      - name: Validate publish artifacts
        run: python scripts/ci_validate_publish.py

      - name: Save engine state cache
        uses: actions/cache/save@v4
        if: success()
        with:
          path: data
          key: maritime-state-${{ github.run_id }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: cycle
    if: ${{ !cancelled() && needs.cycle.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
