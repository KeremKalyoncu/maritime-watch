line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
  "E501",   # long lines: data tables and URLs
  "B008",   # function calls in defaults: not used here in a risky way
  "SIM105", # try/except/pass is clearer than contextlib.suppress for one-liners
  "UP042",  # str+Enum is deliberate: values serialise straight to JSON
]

[lint.per-file-ignores]
"tests/*" = ["B", "SIM"]
"eval/*" = ["E402"]
